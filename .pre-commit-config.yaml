# Install both hook types with a bare `pre-commit install`.
default_install_hook_types: [pre-commit, commit-msg]

# Without this, hooks default to every stage — so installing the commit-msg
# hook type makes the whole suite run a second time per commit. Only
# conventional-pre-commit opts back in to commit-msg.
default_stages: [pre-commit]

# Helm templates are Go templates, not YAML — check-yaml chokes on {{ }}.
exclude: ^gitops/charts/.*/templates/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # Cleans .terraform between runs so a stale init cannot mask an error.
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
        args: [--args=--recursive]
      - id: terraform_docs
        args: [--hook-config=--add-to-existing-file=true, --hook-config=--create-file-if-not-exist=true]
      - id: terraform_checkov
        args: [--args=--quiet, --args=--compact]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      # Docker variant pins the same version locally and in CI.
      - id: hadolint-docker

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, refactor, chore, ci, test, style, perf, build, revert]
